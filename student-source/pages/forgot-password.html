<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | HeronSearch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/forgot-password.css">
</head>
<body data-layout="public">
  <div id="site-header"></div>

  <main class="auth">
    <h1>Forgot Password?</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset it</p>

    <form class="auth-card" action="#" method="post">
      <!-- Backend: remove the "hidden" attribute after the email is sent -->
      <p class="notice" id="reset-sent" hidden>Check your email for a link to reset your password.</p>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
    </form>

    <p class="auth-switch">Remembered it? <a href="login.html">Back to sign in</a></p>
  </main>

  <div id="site-footer"></div>
  <script src="../js/layout.js"></script>
</body>
</html>
