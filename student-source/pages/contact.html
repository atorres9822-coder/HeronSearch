<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | HeronSearch</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/contact.css">
</head>
<body data-layout="public">
  <div id="site-header"></div>

  <main class="form-page">
    <h1>Contact Us</h1>
    <p class="subtitle">Have a question or a problem? Send us a message and the HeronSearch team will get back to you.</p>

    <form class="form-card" action="#" method="post">
      <!-- Backend: remove the "hidden" attribute after the message is sent -->
      <p class="notice" id="message-sent" hidden>Your message has been sent. We'll reply by email.</p>

      <div class="field-row">
        <div class="field">
          <label for="name">Name*</label>
          <input type="text" id="name" name="name" placeholder="Your full name" required>
        </div>
        <div class="field">
          <label for="email">Email Address*</label>
          <input type="email" id="email" name="email" placeholder="Your email" required>
        </div>
      </div>

      <div class="field">
        <label for="subject">Subject*</label>
        <input type="text" id="subject" name="subject" placeholder="What is this about?" required>
      </div>

      <div class="field">
        <label for="message">Message*</label>
        <textarea id="message" name="message" required></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send Message</button>
      </div>
    </form>

    <p class="contact-alt">Looking for answers first? Visit <a href="help.html">Help &amp; Guidelines</a>.</p>
  </main>

  <div id="site-footer"></div>
  <script src="../js/layout.js"></script>
</body>
</html>
